# IP real del cliente para el límite de intentos de login del backend (trust proxy 1).
# Por el túnel de Cloudflare llega en CF-Connecting-IP (Cloudflare la pone y no se puede falsear
# desde internet); en la red local es la de la conexión.
map $http_cf_connecting_ip $ip_cliente {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Tiempo real (Server-Sent Events): /api/eventos → http://backend:3000/eventos.
  # Sin búfer para que cada aviso llegue al instante, y abierta hasta 1 h (el backend
  # manda un latido cada 25 s; con 30 s, como el resto de la API, se cortaría).
  location /api/eventos {
    proxy_pass http://backend:3000/eventos;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $ip_cliente;
    proxy_set_header X-Forwarded-For $ip_cliente;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # API: /api/casos → http://backend:3000/casos
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $ip_cliente;
    proxy_set_header X-Forwarded-For $ip_cliente;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Archivos con hash en el nombre: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca en caché, para que cada despliegue se vea al instante
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # PWA: el service worker y el manifest tampoco, o la app instalada se quedaría en la versión vieja
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
