# IP real del cliente para el límite de intentos de login del backend (trust proxy 1).
# CF-Connecting-IP solo se acepta en el puerto interno 8081, que usa el túnel de Cloudflare y no se
# publica en el host. En el puerto 80 (publicado, accesible desde la red local) se ignora y se usa la
# IP de la conexión, así que nadie puede falsear su IP con esa cabecera.
map "$server_port:$http_cf_connecting_ip" $ip_cliente {
  default             $remote_addr;
  "~^8081:(?<ip>.+)$" $ip;
}

# HSTS solo cuando el cliente llegó por HTTPS (el túnel manda X-Forwarded-Proto: https).
map $http_x_forwarded_proto $hsts {
  default "";
  https   "max-age=31536000; includeSubDomains";
}

# Esquema real del cliente para el backend: con el túnel llega X-Forwarded-Proto: https y se conserva
# (nginx ve http); sin él, el esquema de la conexión. Así la cookie de sesión lleva Secure por HTTPS.
map $http_x_forwarded_proto $proto_cliente {
  default $scheme;
  https   https;
}

server {
  listen 80;
  listen 8081;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Tiempo real (Server-Sent Events): /api/eventos → http://backend:3000/eventos.
  # Sin búfer para que cada aviso llegue al instante, y abierta hasta 1 h (el backend
  # manda un latido cada 25 s; con 30 s, como el resto de la API, se cortaría).
  location /api/eventos {
    proxy_pass http://backend:3000/eventos;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $ip_cliente;
    proxy_set_header X-Forwarded-For $ip_cliente;
    proxy_set_header X-Forwarded-Proto $proto_cliente;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Módulo de documentos: /api/doc/... → http://backend:3000/doc/...
  # Aquí se suben archivos de hasta 25 MB (y firmas de hasta 2 MiB), así que el tope es mayor
  # que el 1 MB del resto del sitio y la espera es más larga.
  location /api/doc/ {
    client_max_body_size 26m;
    proxy_pass http://backend:3000/doc/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $ip_cliente;
    proxy_set_header X-Forwarded-For $ip_cliente;
    proxy_set_header X-Forwarded-Proto $proto_cliente;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
  }

  # API: /api/casos → http://backend:3000/casos
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $ip_cliente;
    proxy_set_header X-Forwarded-For $ip_cliente;
    proxy_set_header X-Forwarded-Proto $proto_cliente;
    proxy_read_timeout 30s;
  }

  # Archivos con hash en el nombre: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/cabeceras-seguridad.conf;
  }

  # index.html nunca en caché, para que cada despliegue se vea al instante
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/cabeceras-seguridad.conf;
  }

  # PWA: el service worker y el manifest tampoco, o la app instalada se quedaría en la versión vieja
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/cabeceras-seguridad.conf;
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache";
    include /etc/nginx/cabeceras-seguridad.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/cabeceras-seguridad.conf;
  }
}
