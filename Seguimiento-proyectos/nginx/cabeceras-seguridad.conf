# Cabeceras de seguridad del frontend. Se incluye en cada location estático porque un add_header
# dentro de un location anula los del server. No se incluye en /api/: ahí las pone helmet.
# CSP: todo es del mismo origen (fuentes locales, API y SSE en /api). style-src admite 'unsafe-inline'
# porque Vue/Quasar escriben estilos en línea; los scripts no admiten nada inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# $hsts queda vacío salvo con X-Forwarded-Proto https (nginx no emite una cabecera de valor vacío).
add_header Strict-Transport-Security $hsts always;
