name: seguimiento-proyectos

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      TZ: ${TZ}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Solo esta PC (Workbench); 3307 para no chocar con el MySQL de XAMPP
    ports:
      - "127.0.0.1:${PUERTO_DB:-3307}:3306"
    volumes:
      - db_datos:/var/lib/mysql
    # Endurecimiento: sin escalar privilegios, con tope de memoria, CPU y procesos
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 300
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [interna]

  backend:
    build: ./Backend
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      SESSION_INACTIVITY_MINUTES: ${SESSION_INACTIVITY_MINUTES}
      CORS_ORIGENES: ${CORS_ORIGENES}
      # Ids con acceso al módulo «Mis actividades» (vacío = nadie; * = todos)
      USUARIOS_CON_ACTIVIDADES: ${USUARIOS_CON_ACTIVIDADES-}
      TRUST_PROXY: "1"
      TZ: ${TZ}
    # Endurecimiento: sin capacidades de Linux, sistema de archivos de solo lectura
    # (solo /tmp escribible, en memoria), sin escalar privilegios y con topes de recursos
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    networks: [interna]

  frontend:
    build:
      context: ./Seguimiento-proyectos
      args:
        API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PUERTO_WEB:-8080}:80"
    # Endurecimiento: nginx arranca como root solo para abrir el puerto 80 y cambiar a su usuario;
    # por eso conserva únicamente esas capacidades. Solo escribe en las carpetas temporales.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=1m
      - /tmp:size=16m
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    networks: [interna]

  # Quick Tunnel de Cloudflare: publica el frontend por nombre dentro de la red de Docker,
  # así no se rompe si cambia la IP de la PC. La URL *.trycloudflare.com cambia en cada
  # reinicio; se consulta con: docker compose logs tunnel
  tunnel:
    image: cloudflare/cloudflared:2026.9.2
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:8081
    depends_on:
      - frontend
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    mem_limit: 256m
    pids_limit: 100
    networks: [interna]

volumes:
  db_datos:

networks:
  interna:
