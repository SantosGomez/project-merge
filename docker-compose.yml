name: seguimiento-proyectos

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      TZ: ${TZ}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_datos:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [interna]

  backend:
    build: ./Backend
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      SESSION_INACTIVITY_MINUTES: ${SESSION_INACTIVITY_MINUTES}
      CORS_ORIGENES: ${CORS_ORIGENES}
      TRUST_PROXY: "1"
      TZ: ${TZ}
    networks: [interna]

  frontend:
    build:
      context: ./Seguimiento-proyectos
      args:
        API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PUERTO_WEB:-8080}:80"
    networks: [interna]

volumes:
  db_datos:

networks:
  interna:
